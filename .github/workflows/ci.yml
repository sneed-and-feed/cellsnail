name: CellSnail Cross-Platform Matrix CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PYTHONPATH: '.'

jobs:
  matrix-ci:
    name: CI & Native Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry and Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/cellsnail_rs/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/cellsnail_rs/Cargo.toml', 'rust/cellsnail_rs/src/**') }}

      - name: Build & Test `#![no_std]` Rust SIMD C-ABI Kernel
        run: |
          cargo test --manifest-path rust/cellsnail_rs/Cargo.toml --release
          cargo build --manifest-path rust/cellsnail_rs/Cargo.toml --release

      - name: Install Python Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest build
          pip install -e .

      - name: Verify Native Rust C-ABI Bridge & Static Arena Footprint
        run: |
          python -c "from cellsnail._native import is_native_available, load_native_library; assert is_native_available(), 'Native Rust C-ABI bridge failed to load!'; sz = int(load_native_library().cellsnail_arena_size_bytes()); print('Loaded native C-ABI, Arena bytes:', sz); assert sz == 983872"

      - name: Audit 21-Rule GFM / KaTeX Math Compliance
        run: |
          python scripts/audit_gfm_math.py README.md docs/ARXIV_LITERATURE_SYNTHESIS.md docs/REFEREE_AUDIT_RESPONSE.md docs/CELLSNAIL_PREPRINT.md docs/EXPEDITION_1_DELTA_HUNT.md docs/EXPEDITION_2_STRINGER_HUNT.md docs/EXPEDITION_3_SPATIAL_BORDER_AUDIT.md

      - name: Run 222-Test Pytest Verification Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify BCM2712 Hardware Cache & Static Zero-Alloc Audit
        run: |
          python scripts/verify_bcm2712_cache.py

      - name: Package Cross-Platform Release Bundle (${{ matrix.os }})
        run: |
          python scripts/package_release.py --version "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0' }}" --out-dir dist

      - name: Upload Cross-Platform Native C-ABI Library, Release Archive & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cellsnail-${{ matrix.os }}-artifacts
          path: |
            dist/*
            rust/cellsnail_rs/target/release/libcellsnail_rs.so
            rust/cellsnail_rs/target/release/libcellsnail_rs.dylib
            rust/cellsnail_rs/target/release/cellsnail_rs.dll
            studio/cellsnail_portable_studio.html
            results/cellsnail_evaluation_summary.json
            results/bcm2712_cache_receipts.json
            results/expedition1_delta_hunt.json
            results/expedition2_stringer_hunt.json
            results/expedition3_spatial_border_audit.json

  release:
    name: Publish GitHub Release
    needs: matrix-ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python Wheel & Source Distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Download Cross-Platform Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-assets/dist/*
            release-assets/**/libcellsnail_rs.so
            release-assets/**/libcellsnail_rs.dylib
            release-assets/**/cellsnail_rs.dll
            rust/cellsnail_rs/include/cellsnail_rs.h
            studio/cellsnail_portable_studio.html
            results/cellsnail_evaluation_summary.json
            results/bcm2712_cache_receipts.json
            results/expedition1_delta_hunt.json
            results/expedition2_stringer_hunt.json
            results/expedition3_spatial_border_audit.json
          draft: false
          prerelease: false
          generate_release_notes: true
