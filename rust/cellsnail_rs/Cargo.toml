[package]
name = "cellsnail_rs"
version = "0.2.0"
edition = "2021"
authors = ["Noah Cohen"]
description = "#![no_std] Rust SIMD and C-ABI library for Cellsnail multi-omic single-cell arena"
license = "CC0-1.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
doctest = false

[features]
default = []
std = []

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
