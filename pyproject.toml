[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellsnail"
version = "0.1.0"
description = "cellsnail: Proof-carrying multi-omic single-cell data science spoke repository in the DarkSnail ecosystem"
authors = [{ name = "DarkSnail Authors" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/sneed-and-feed/cellsnail"
Repository = "https://github.com/sneed-and-feed/cellsnail"

[tool.setuptools.packages.find]
where = ["."]
include = ["cellsnail*"]

[tool.setuptools.package-data]
cellsnail = ["*.dll", "*.so", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
